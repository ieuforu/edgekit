name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm fmt:check

      - name: Type check (all packages)
        run: pnpm typecheck

      - name: Test (shared)
        run: pnpm --filter @edgekit/shared test

      - name: Test (api)
        run: pnpm --filter api test

      - name: Test (web)
        run: pnpm --filter web test

      - name: Build (web)
        run: pnpm --filter web build
